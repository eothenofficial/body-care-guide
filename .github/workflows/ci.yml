name: 内容与构建检查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: validate-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: 校验内容与本地资源
        run: python scripts/build_current.py --check
      - name: 标准库单元测试（不访问外网）
        run: python scripts/run_current_checks.py
      - name: 构建所有静态产物
        run: python scripts/build_current.py

